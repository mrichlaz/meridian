services:
  meridian:
    build: .
    container_name: meridian
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist everything — config, state, bot-tracker DB, logs
      - ./data:/app/data
      - ./logs:/app/logs
      - ./user-config.json:/app/user-config.json
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
