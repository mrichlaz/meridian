services:
  meridian:
    build: .
    container_name: meridian
    restart: unless-stopped
    volumes:
      # Persist all runtime state (bot-tracker DB, lessons, memory, etc.)
      - data:/app/data
      - logs:/app/logs
    environment:
      - NODE_ENV=production
      # Pin the persistent paths the agent reads/writes — utils/paths.js
      # honours these env vars and falls back to /app/data + /app/logs if
      # unset, so the explicit values here are belt-and-suspenders.
      - DATA_DIR=/app/data
      - LOG_DIR=/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
  logs:
