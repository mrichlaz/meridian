services:
  meridian:
    build: .
    container_name: meridian
    restart: unless-stopped
    volumes:
      # Persist all runtime state (bot-tracker DB, lessons, memory, etc.)
      - data:/app/data
      - logs:/app/logs
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
  logs:
