services:
  meridian:
    build: .
    container_name: meridian
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist user config (deploy amount, risk settings, etc.)
      - ./user-config.json:/app/user-config.json
      # Bot-tracker SQLite DB
      - ./data:/app/data
      # Logs
      - ./logs:/app/logs
      # State files (lessons, positions, memory — survives restarts)
      - ./state.json:/app/state.json
      - ./lessons.json:/app/lessons.json
      - ./pool-memory.json:/app/pool-memory.json
      - ./token-blacklist.json:/app/token-blacklist.json
      - ./strategy-library.json:/app/strategy-library.json
      - ./decision-log.json:/app/decision-log.json
      - ./signal-weights.json:/app/signal-weights.json
      - ./smart-wallets.json:/app/smart-wallets.json
      - ./hivemind-cache.json:/app/hivemind-cache.json
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
