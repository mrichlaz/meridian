services:
  meridian:
    build: .
    container_name: meridian
    restart: unless-stopped
    volumes:
      # Persist all runtime state (bot-tracker DB, lessons, memory, etc.)
      - data:/app/data
      - logs:/app/logs
    environment:
      - NODE_ENV=production
      # Pin the persistent paths the agent reads/writes — utils/paths.js
      # honours these env vars and falls back to /app/data + /app/logs if
      # unset, so the explicit values here are belt-and-suspenders.
      - DATA_DIR=/app/data
      - LOG_DIR=/app/logs
    # Mount the .env from the host so the container sees WALLET_PRIVATE_KEY,
    # HELIUS_API_KEYS, LLM_*, TELEGRAM_*, etc. Override path with
    # `env_file: - /some/other/.env` in a deploy-specific override file.
    env_file:
      - .env
    # Dead-man probe: unhealthy when open positions exist but the daemon
    # heartbeat (data/heartbeat.json, written each management cycle) is
    # stale — i.e. the process is hung, not crashed (crashes are covered by
    # restart: unless-stopped). Shows in `docker ps`; pair with an autoheal
    # container if you want unhealthy → automatic restart.
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 5m
      timeout: 20s
      retries: 2
      start_period: 10m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
  logs:
