name: Build & Push Docker (arm64)

# Native arm64 build for Apple Silicon / Linux ARM servers.
# GitHub-hosted ARM64 runner is in limited preview; the job fails fast
# (30 min) when no runner is online, and the user can re-trigger via
# workflow_dispatch when one comes back. Concurrency cancels in-progress
# builds on new push so the queue doesn't pile up.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-build-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha::7}}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
